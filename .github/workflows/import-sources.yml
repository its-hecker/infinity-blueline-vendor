name: Import Pixel 3 Android 17 vendor
on:
  push:
    paths:
      - .github/workflows/import-sources.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pixel3-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          lfs: false
      - name: Import proven Lineage-based Infinity-X vendor
        shell: bash
        run: |
          set -euo pipefail
          if test -f blueline-vendor.mk; then
            echo "Sources already imported; skipping to avoid overwriting changes."
            exit 0
          fi
          git config user.name "Hecker"
          git config user.email "118846180+its-hecker@users.noreply.github.com"
          git remote add boot-source https://github.com/its-hecker/blueline_infinity_vendor.git
          git fetch --depth=1 --no-tags boot-source +refs/heads/main:refs/remotes/boot-source/main
          git lfs install --local
          git config lfs.url "https://github.com/${GITHUB_REPOSITORY}.git/info/lfs"
          git config lfs.pushurl "https://github.com/${GITHUB_REPOSITORY}.git/info/lfs"
          GIT_LFS_SKIP_SMUDGE=1 git checkout refs/remotes/boot-source/main -- . ':(exclude).github/workflows'
          git lfs fetch boot-source refs/remotes/boot-source/main
          git lfs checkout
          git add -A
          git commit -m "Import Android 17 Lineage-based Pixel 3 vendor for Infinity-X"
          git lfs push origin HEAD
          git push origin HEAD:main
